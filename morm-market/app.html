<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORM — 移動中…</title>
<meta name="robots" content="noindex">
<script>
// app.html はスワップ/ブリッジ専用ページだったが、チャートと統合し index.html の
// タブに集約した。旧リンク（morm.one の ?m0r= 含む）を保持したままリダイレクトする。
(function(){
  var q=location.search||"";
  var m=null; try{ m=new URLSearchParams(q).get("m0r"); }catch(e){}
  var hash = m ? "#bridge" : (location.hash || "#swap");
  location.replace("index.html"+q+hash);
})();
</script>
</head><body style="font-family:system-ui,sans-serif;background:#0A0A0C;color:#F4F2EA;margin:0">
<div style="max-width:520px;margin:0 auto;padding:40px 16px">
  ページを統合しました。自動で移動します →
  <a href="index.html" style="color:#5D6DFF">market.morm.one</a>
</div>
</body></html>
